name: Check formatting
on:
  pull_request:

jobs:
  pre-commit:
    name: Run pre-commit hooks
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout the latest code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Only the files the PR changes, as in Ginkgo: reuse-annotate bumps the
      # copyright year of every file it runs on.
      - name: Run pre-commit hooks
        run: |
          pipx run pre-commit run --show-diff-on-failure --color=always \
            --from-ref "origin/${{ github.base_ref }}" --to-ref HEAD
      - name: Create formatting patch
        if: ${{ failure() }}
        run: git diff > format.patch
      - name: Upload formatting patch
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: patch
          path: format.patch
